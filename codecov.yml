# Codecov Configuration File
coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 0%
        if_ci_failed: error

    patch:
      default:
        target: 80%
        threshold: 0%

comment:
  layout: "reach,diff,flags,tree,reach"
  behavior: default
  require_changes: false

ignore:
  - "**/*.test.js"
  - "**/*.test.jsx"
  - "**/*.spec.js"
  - "**/*.spec.jsx"
  - "**/node_modules/**"
  - "**/vendor/**"
  - "**/__tests__/**"
  - "**/__mocks__/**"
